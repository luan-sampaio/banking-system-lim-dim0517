name: Integração Contínua (Build) - L.I.M.

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Build / Checagem Sintática
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Pytest
        run: |
          pytest tests/ -v

      - name: Criar e fazer Push da Tag
        run: |
          # O github.run_number agora será sequencial e contínuo
          TAG_NAME="build-${{ github.run_number }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag -a $TAG_NAME -m "Build automático da integração contínua - Número ${{ github.run_number }}"
          git push origin $TAG_NAME