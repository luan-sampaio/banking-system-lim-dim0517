name: Estabilização - Banking System L.I.M.

on:
  pull_request:
    branches: [ "staging" ]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Build / Checagem Sintática
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Pytest
        run: |
          pytest tests/ -v

  stabilize:
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Build / Checagem Sintática
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Pytest
        run: |
          pytest tests/ -v

      - name: Determinar nova tag rc-X.Y
        id: tag
        run: |
          git fetch --tags
          MAX_TAG=$(git tag --list 'rc-*' | grep -E '^rc-[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n | tail -1)
          if [ -z "$MAX_TAG" ]; then
            NEW_TAG="rc-1.0"
          else
            X=$(echo "$MAX_TAG" | sed 's/^rc-//' | cut -d. -f1)
            Y=$(echo "$MAX_TAG" | sed 's/^rc-//' | cut -d. -f2)
            Y=$((Y + 1))
            NEW_TAG="rc-$X.$Y"
          fi
          echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Criar e fazer Push da Tag
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag -a "$TAG_NAME" -m "Release Candidate $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Gerar pacote da versão
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          git archive --format=zip --output="${TAG_NAME}.zip" "$TAG_NAME"

      - name: Upload do Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.tag_name }}
          path: "*.zip"
